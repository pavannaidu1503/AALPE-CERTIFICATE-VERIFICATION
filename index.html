<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification | AALPE</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <!-- Logo -->
            <img src="images/logo.png" alt="AALPE Logo" class="logo">

            <!-- Heading -->
            <h1>Certificate Verification</h1>

            <p class="subtitle">
                Verify the authenticity of certificates issued by
                <strong>AALPE</strong>
            </p>

            <!-- Search Form -->
            <div class="search-box">

                <label for="certificateId">
                    <i class="fa-solid fa-id-card"></i>
                    Certificate ID
                </label>

                <input
                    type="text"
                    id="certificateId"
                    placeholder="Enter Certificate ID"
                    autocomplete="off"
                >

                <button id="verifyBtn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Verify Certificate
                </button>

            </div>

        </div>

        <footer>
            © 2026 AALPE | All Rights Reserved.
        </footer>

    </div>

    <script src="js/search.js"></script>

</body>
</html>
